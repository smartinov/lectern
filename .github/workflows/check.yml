name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EPUB tools
        run: brew install pandoc imagemagick epubcheck shellcheck
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Check
        run: scripts/check.sh
