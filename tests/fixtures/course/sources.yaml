sources:
  - id: spacing-review
    title: The science of effective learning with spacing and retrieval practice
    url: https://www.nature.com/articles/s44159-022-00089-1
    author: Shana K. Carpenter, Steven C. Pan, and Andrew C. Butler
    date: "2022-08-02"
    accessed: "2026-09-14"
    finding: The review describes evidence for spacing and retrieval across learning contexts, and discusses learner beliefs that contribute to underusing these strategies.
    limitations: The public abstract and overview support this summary; the review does not test this ebook or establish its example schedule as optimal.
